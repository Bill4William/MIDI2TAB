name: Release

# Publishes a GitHub Release with both installers whenever main carries a
# version that has no release yet. The version comes from MyAppVersion in
# build/installer.iss, so releasing is: bump the version, merge to main.
# Pushes where the release already exists finish in seconds.
#
# Pull requests into main run everything except the final publish, so a
# release that would break is caught before merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 1. Decide whether this commit needs a release ------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from build/installer.iss
        id: version
        run: |
          # installer.iss is stored with CRLF line endings (.gitattributes)
          VERSION=$(sed -n 's/^#define MyAppVersion *"\(.*\)"/\1/p' build/installer.iss | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read MyAppVersion from build/installer.iss"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check the version is the same everywhere it is shown
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fail=0
          for f in src/gui.py build/MIDI2TAB.spec build/build_mac.sh; do
            if ! grep -q "$VERSION" "$f"; then
              echo "::error file=$f::does not mention version $VERSION (from build/installer.iss)"
              fail=1
            fi
          done
          exit $fail

      - name: Check whether release v${{ steps.version.outputs.version }} exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists - nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist yet."
          fi

  # ---- 2. Build both installers (reusing the platform workflows) ------------
  windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: ./.github/workflows/build-windows.yml

  macos:
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: ./.github/workflows/build-mac.yml

  # ---- 3. Publish (skipped on pull requests) --------------------------------
  publish:
    needs: [check, windows, macos]
    if: needs.check.outputs.exists == 'false' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List files to publish
        run: ls -la dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MIDI2TAB v${{ needs.check.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/*.exe
            dist-release/*.dmg
          body: |
            ## Download
            - **Windows:** `MIDI2TAB_Setup_v${{ needs.check.outputs.version }}.exe` — run it; if Windows shows "Windows protected your PC", click **More info → Run anyway** (the installer is not code-signed).
            - **macOS:** `MIDI2TAB_v${{ needs.check.outputs.version }}.dmg` — open it and drag MIDI2TAB to Applications. On first launch, open **System Settings → Privacy & Security** and click **Open Anyway** (the app is not notarized).
